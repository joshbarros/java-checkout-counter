server:
  port: 8080
spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5436/inventory
    username: platform
    password: platform
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9097
  rabbitmq:
    host: localhost
    port: 5676
    username: platform
    password: platform
    listener:
      simple:
        default-requeue-rejected: false
management:
  endpoints:
    web:
      exposure:
        include: health
